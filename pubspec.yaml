name: campus_flutter
description: "TUM Campus App"
publish_to: 'none'
version: 5.4.1+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter

  # networking
  dio: ^5.11.1
  drift: ^2.35.3
  sqlite3: ^3.9.1
  json_annotation: ^4.12.0
  json_serializable: ^6.15.2
  cached_network_image: ^4.0.6
  grpc: ^5.2.0
  protobuf: ^6.1.0
  xml: ^7.0.1
  xml2json: ^6.1.0

  # state management
  rxdart: ^0.28.0
  go_router: ^18.1.3
  flutter_riverpod: ^3.5.0
  get_it: ^9.3.0

  # user interface
  shimmer: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.2
  flutter_linkify: ^6.0.0
  home_widget: ^0.10.0
  auto_size_text: ^3.0.0
  quick_actions: ^1.1.1
  flutter_native_splash: ^2.4.8
  syncfusion_flutter_core: ^35.1.43
  syncfusion_flutter_calendar: ^35.1.43
  syncfusion_flutter_charts: ^35.1.43
  syncfusion_flutter_datepicker: ^35.1.43
  video_player: ^2.14.1
  barcode_widget: ^2.0.4
  lottie: ^3.8.2
  timeago: ^3.7.1
  flutter_colorpicker:
    git:
      url: https://github.com/mchome/flutter_colorpicker.git
      ref: master
  flutter_contacts: ^2.6.0
  maplibre_gl: ^0.28.0

  # calendar sync
  device_calendar: ^4.3.3

  # helpers
  device_info_plus: ^13.3.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.3
  permission_handler: ^13.0.2
  uuid: ^4.6.0
  collection: ^1.19.1
  shared_preferences: ^2.5.6
  map_launcher: ^7.0.0
  html: ^0.15.7

  # firebase
  firebase_crashlytics: ^6.0.1
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1

  # localization
  easy_localization: ^3.0.8
  easy_logger: ^0.0.2
  intl: ^0.20.3
  app_links: ^7.2.2

dependency_overrides:
  xml2json:
    git:
      url: https://github.com/jakobkoerber/xml2json.git
      ref: master
  grpc:
    git:
      url: https://github.com/jakobkoerber/grpc-dart.git
      ref: master
  flutter_linkify:
    git:
      url: https://github.com/jakobkoerber/flutter_linkify
      ref: master
  device_calendar:
    git:
      url: https://github.com/jakobkoerber/device_calendar.git
      ref: develop

  # The caching gRPC fork pins meta 1.17.0; Flutter 3.47 needs 1.18.3.
  meta: ^1.18.3

dev_dependencies:
  # code generation
  build_runner: ^2.16.1
  drift_dev: ^2.35.2

  # testing
  flutter_test:
    sdk: flutter
  test: ^1.31.1

  # linting
  flutter_lints: ^6.0.0
  lints: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/mapStyles/
    - assets/images/logos/tum-logo-blue.png
    - assets/images/logos/tum-logo-white.png
    - assets/images/logos/tum-logo-blue-text.png
    - assets/images/logos/tum-logo-rainbow.png
    - assets/images/placeholders/portrait_placeholder.png
    - assets/images/placeholders/movie_placeholder.png
    - assets/images/placeholders/news_placeholder.png
    - assets/images/placeholders/student_club_placeholder.png
    - assets/images/errors/error.svg
    - assets/lottieFiles/gradient_background_blue_red.json
    - assets/lottieFiles/gradient_background_blue_white.json
    - assets/lottieFiles/gradient_background_blue_white_speedup.json
    - assets/lottieFiles/gradient_background_silver_white.json
    - assets/images/tower.png
    - assets/videos/token-tutorial.mp4
    - assets/images/campus/campus-freising.jpg
    - assets/images/campus/campus-garching.jpeg
    - assets/images/campus/campus-klinikum.jpg
    - assets/images/campus/campus-olympia.jpg
    - assets/images/campus/campus-stamm.jpeg
    - assets/images/location.png
    - assets/images/map/locate.webp
    - assets/images/map/pin_blue.webp
    - assets/images/map/pin_red.webp
